# Fly.io config — https://fly.io/docs/reference/configuration/
#
# This path gives you a PERSISTENT shared board (salad history survives
# restarts) via a Fly volume mounted at /data.
#
# First-time setup (run locally, after `fly auth login`):
#   1. Pick a unique name below (or run `fly launch --no-deploy` to generate one).
#   2. fly volumes create salad_data --size 1 --region iad
#   3. fly deploy
#
# `app` must be GLOBALLY UNIQUE across Fly — change it before deploying.
app = "last-salad-CHANGE-ME"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  DB_PATH = "/data/salads.db"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.checks]
    [http_service.checks.health]
      method = "GET"
      path = "/healthz"
      interval = "15s"
      timeout = "2s"
      grace_period = "5s"

# Persistent storage for the SQLite database.
[[mounts]]
  source = "salad_data"
  destination = "/data"
